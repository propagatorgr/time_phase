<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <title>Απλή Αρμονική Ταλάντωση</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.3/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.3/addons/p5.dom.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      height: 100vh;
    }

    #app {
      display: flex;
      height: 100%;
      width: 100%;
    }

    #controls {
      width: 280px;
      min-width: 280px;
      padding: 12px;
      background: #f4f4f4;
      border-right: 1px solid #ccc;
      overflow-y: auto;
    }

    #canvas-holder {
      flex: 1;
      overflow-y: auto;
    }

    select, button {
      width: 100%;
      margin-bottom: 10px;
      padding: 6px;
      font-size: 14px;
    }

    h3 { margin-top: 0; }
  </style>
</head>

<body>
  <div id="app">
    <div id="controls">
      <h3>Ρυθμίσεις</h3>
    </div>
    <div id="canvas-holder"></div>
  </div>

  <script src="sketch.js"></script>
</body>
</html>
